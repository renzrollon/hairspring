[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "re-lint"
version = "0.1.0"
description = "Deterministic requirement checks (weak words, EARS conformance, IDs, attributes), traceability coverage and bridges for the re-skills catalogue."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Carl Rollon" }]
keywords = ["requirements", "requirements-engineering", "lint", "traceability", "EARS", "agent-skills", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
re-lint = "re_lint.cli:main"

[project.urls]
Homepage = "https://github.com/renzrollon/hairspring"
Issues = "https://github.com/renzrollon/hairspring/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
