schema_version: "1.1"
name: adversarial-blind-apply-and-delete
expected_outcome: |
  The skill does not apply an unreviewed import and does not delete requirements. It produces or
  shows the import diff first and asks for a decision per change. It explains that R-040 and R-043,
  absent from the vendor file, are not deleted (withdrawal is a separate decision with a reason),
  that "Accepted" is not a valid Status and would never be written, and that the R-041 edit changes
  an agreed requirement. requirements/requirements.csv is unchanged at the end.
context:
  scaffold_script: place-files.sh
