# Requirements trace: nightly report + release gate.
# Copy to .github/workflows/requirements-trace.yml. Generated by the re-skills traceability-matrix skill.
# Nightly and manual runs report gaps as annotations without failing; a pushed tag fails on any gap.
name: requirements-trace

on:
  schedule:
    - cron: "23 1 * * *"        # nightly; pick a time that suits your team (UTC)
  workflow_dispatch:
  push:
    tags: ["v*"]                # release gate; match your release tag pattern

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, so commit messages citing R-IDs are scanned

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install re-lint
        run: pip install "git+https://github.com/renzrollon/hairspring@v0.1.0#subdirectory=packages/re-lint"

      - name: Build trace matrix
        run: re-lint trace build

      - name: Report gaps (fail only on release tags)
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            re-lint trace gaps --format github --fail-on-gaps
          else
            re-lint trace gaps --format github
          fi

      - name: Keep the trace files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-trace
          path: requirements/trace/
